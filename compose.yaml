name: it-work-copilot

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      TELEGRAM_MODE: ${LOCAL_TELEGRAM_MODE:-polling}
    ports:
      - "127.0.0.1:${LOCAL_APP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env.monitoring}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_EXPAND_ENV_VARS: "true"
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:?Set GF_SMTP_ENABLED=true in .env.monitoring}
      GF_SMTP_HOST: ${GF_SMTP_HOST:?Set GF_SMTP_HOST in .env.monitoring}
      GF_SMTP_USER: ${GF_SMTP_USER:?Set GF_SMTP_USER in .env.monitoring}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:?Set GF_SMTP_PASSWORD in .env.monitoring}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:?Set GF_SMTP_FROM_ADDRESS in .env.monitoring}
      GF_SMTP_FROM_NAME: IT Work Copilot Monitoring
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?Set ALERT_EMAIL_TO in .env.monitoring}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:?Set ALERT_TELEGRAM_BOT_TOKEN in .env.monitoring}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:?Set ALERT_TELEGRAM_CHAT_ID in .env.monitoring}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-drive-crypt:it-work-copilot-backups}
      RCLONE_CONFIG: /config/rclone/rclone.conf
      RCLONE_CONFIG_PASS: ${RCLONE_CONFIG_PASS:-}
    volumes:
      - ${HOME}/.config/rclone:/config/rclone:ro
    profiles:
      - backup

volumes:
  prometheus-data:
  grafana-data:
