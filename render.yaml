services:
  - type: web
    name: it-work-copilot
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_API_ROOT
        value: https://api.telegram.org
      - key: APP_TIMEZONE
        value: Asia/Dubai
      - key: REMINDER_POLL_MS
        value: "30000"
      - key: XAI_MODEL
        value: grok-4.7
      - key: XAI_BASE_URL
        value: https://api.x.ai/v1
      - key: LOG_LEVEL
        value: info
      - key: MAX_UPLOAD_BYTES
        value: "20971520"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
