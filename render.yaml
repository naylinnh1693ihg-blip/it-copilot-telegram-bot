services:
  - type: web
    name: it-work-copilot
    runtime: node
    plan: free
    buildCommand: npm ci --production=false && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_API_ROOT
        value: https://api.telegram.org
      - key: APP_TIMEZONE
        value: Asia/Dubai
      # Backup trigger. The main one is Supabase pg_cron calling POST /internal/reminders/process
      # every minute (supabase/migrations/20261115010000_reminder_cron.sql), which also keeps
      # this free service awake. Both can run together: claim_due_reminders uses
      # FOR UPDATE SKIP LOCKED, so a reminder is never sent twice.
      - key: REMINDER_POLL_MS
        value: "30000"
      - key: XAI_MODEL
        value: grok-4.7
      - key: XAI_BASE_URL
        value: https://api.x.ai/v1
      # Claude backup. Only used when ANTHROPIC_API_KEY is set.
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: LLM_FALLBACK_COOLDOWN_MS
        value: "300000"
      - key: LOG_LEVEL
        value: info
      - key: MAX_UPLOAD_BYTES
        value: "20971520"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Bearer token for POST /internal/reminders/process. Must equal the Vault secret
      # 'reminder_cron_secret' in Supabase, or every cron call gets 401.
      - key: CRON_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      # Optional. Empty means no Claude backup.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_ENABLED
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
