apiVersion: 1

contactPoints:
  - orgId: 1
    name: copilot-email
    receivers:
      - uid: copilot-email
        type: email
        settings:
          addresses: "${ALERT_EMAIL_TO}"
          singleEmail: true
  - orgId: 1
    name: copilot-telegram
    receivers:
      - uid: copilot-telegram
        type: telegram
        settings:
          bottoken: "${ALERT_TELEGRAM_BOT_TOKEN}"
          chatid: |
            ${ALERT_TELEGRAM_CHAT_ID}
